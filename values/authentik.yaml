# authentik chart values: https://artifacthub.io/packages/helm/goauthentik/authentik
# Secrets come from the "authentik-secrets" Secret made by scripts/create-authentik-secret.sh
# (never commit them: this repo is public).
global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgres-password

server:
  ingress:
    enabled: true
    # empty = cluster's default ingress class (Traefik on k3s)
    ingressClassName: ""
    hosts:
      - authentik.devbox

# bundled Postgres; stores data on the cluster's default StorageClass
postgresql:
  enabled: true
  auth:
    existingSecret: authentik-secrets
    secretKeys:
      userPasswordKey: postgres-password
      adminPasswordKey: postgres-password
  primary:
    containerSecurityContext:
      # Ubuntu 26.04 / AppArmor 5: containerd's default profile blocks Postgres processes
      # signalling each other ("could not signal for checkpoint: Permission denied")
      appArmorProfile:
        type: Unconfined
    # default probe also waits for Bitnami marker files the official postgres image never creates
    customReadinessProbe:
      exec:
        command: [sh, -c, exec pg_isready -U authentik -d dbname=authentik -h 127.0.0.1 -p 5432]
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
