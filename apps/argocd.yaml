apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.20.0
      helm:
        releaseName: argocd
        valueFiles:
          - $values/values/argocd.yaml
    - repoURL: https://github.com/moabdelazem/argocd-apps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false # never let a bad commit delete ArgoCD itself
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
